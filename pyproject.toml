[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-fault-platform-workspace"
version = "0.1.0"
description = "Monorepo workspace metadata for the traffic fault platform"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = [
  "packages/ai-core/src",
  "apps/training-runner/src",
  "apps/inference-service/src",
]
