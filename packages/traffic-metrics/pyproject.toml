[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-metrics"
version = "0.1.0"
description = "Evaluation metrics for traffic accident QA models"
requires-python = ">=3.10"
authors = [{ name = "taeo team" }]
readme = "README.md"
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
