[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-ai-core"
version = "0.1.0"
description = "Shared Python core utilities for the traffic fault platform"
requires-python = ">=3.10"
authors = [{ name = "taeo team" }]
readme = "README.md"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
