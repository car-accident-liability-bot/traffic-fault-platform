plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.13'
    id 'io.spring.dependency-management' version '1.1.7' // 수정: starter 버전 자동 관리
}

group = 'com.trafficfault'
version = '0.0.1-SNAPSHOT'

description = 'Traffic fault Java backend adapter for the Python inference service'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21) // 수정: JDK 21 기준
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('bootJar') {
    archiveFileName = 'backend-api-java.jar'
}