[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-training-runner"
version = "0.1.0"
description = "Training and dataset preparation runner for the traffic fault platform"
requires-python = ">=3.10"
readme = "README.md"
dependencies = []

[project.scripts]
traffic-build-pipeline-subset = "training_runner.cli.build_pipeline_subset:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
